site_name: Drag & Drop Inventory System
site_description: Unity inventory system with drag & drop, stacking, swapping, and trading

theme:
  name: material
  language: ru
  palette:
    - scheme: slate
      primary: deep purple
      accent: amber
      toggle:
        icon: material/brightness-4
        name: Light mode
    - scheme: default
      primary: deep purple
      accent: amber
      toggle:
        icon: material/brightness-7
        name: Dark mode
  features:
    - navigation.sections
    - navigation.expand
    - navigation.top
    - navigation.tabs
    - content.code.copy
    - search.highlight
  icon:
    logo: material/package-variant-closed

plugins:
  - search
  - i18n:
      docs_structure: suffix
      languages:
        - locale: ru
          name: Русский
          default: true
          build: true
          nav_translations:
            Home: Главная
            Examples: Примеры
            Core Concepts: Основные концепции
            Advanced Systems: Продвинутые системы
            Reference: Справочник
            Feedback: Обратная связь
        - locale: en
          name: English
          build: true
          nav_translations:
            Home: Home
            Examples: Examples
            Core Concepts: Core Concepts
            Advanced Systems: Advanced Systems
            Reference: Reference
            Feedback: Feedback

nav:
  - Home:
    - index.md
    - getting-started/quick-start.md
  - Examples:
    - examples/index.md
    - examples/demo1-inventories.md
    - examples/demo2-loot.md
    - examples/demo3-minecraft.md
    - examples/demo4-trading.md
    - examples/demo5-containers.md
  - Core Concepts:
    - architecture/data-binding.md
    - architecture/binding-templates.md
    - architecture/transfer-pipeline.md
    - architecture/drop-policy-matrix.md
    - architecture/item-conversion-cookbook.md
    - architecture/strategies.md
    - architecture/rules.md
    - architecture/drop-areas.md
  - Advanced Systems:
    - systems/selection.md
    - systems/context-menu.md
    - systems/tooltips.md
    - systems/filter-sort.md
    - systems/interaction.md
    - systems/world-3d.md
  - Reference:
    - reference/optional-interfaces.md
    - reference/file-map.md
    - reference/events.md
    - reference/logs-and-debugging.md
    - reference/troubleshooting.md
  - Feedback:
    - feedback.md
    - examples/showcase.md

markdown_extensions:
  - admonition
  - pymdownx.details
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.tabbed:
      alternate_style: true
  - attr_list
  - md_in_html
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.snippets
  - def_list
  - tables

docs_dir: content
site_dir: .site

extra_css:
  - stylesheets/extra.css
